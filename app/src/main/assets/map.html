<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; font-family:sans-serif; }
#map { width:100%; height:100%; position:relative; touch-action:none; }
canvas { display:block; width:100%; height:100%; }

#hint {
    position:absolute; top:12px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.62); color:#fff; padding:7px 18px;
    border-radius:20px; font-size:14px; z-index:9; pointer-events:none; white-space:nowrap;
}
#coords-pill {
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    background:rgba(27,138,60,.92); color:#fff; padding:8px 22px;
    border-radius:24px; font-size:15px; font-weight:bold; z-index:9;
    pointer-events:none; white-space:nowrap; display:none;
}
#route-pill {
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    background:rgba(21,101,192,.92); color:#fff; padding:8px 20px;
    border-radius:24px; font-size:14px; font-weight:bold; z-index:9;
    pointer-events:none; white-space:nowrap; display:none;
}
#zoom-btns {
    position:absolute; top:12px; left:12px; display:flex; flex-direction:column; z-index:9;
}
.zbtn {
    width:36px; height:36px; background:#fff; border:1px solid #ccc;
    font-size:22px; line-height:1; cursor:pointer; display:flex; align-items:center;
    justify-content:center; user-select:none; color:#333;
}
.zbtn:first-child { border-radius:4px 4px 0 0; border-bottom:none; }
.zbtn:last-child  { border-radius:0 0 4px 4px; }
#attr {
    position:absolute; bottom:2px; right:4px; font-size:10px; color:#444; z-index:9; pointer-events:none;
}
</style>
</head>
<body>
<div id="map">
  <canvas id="c"></canvas>
  <div id="hint">👆 Нажми на карту для выбора точки</div>
  <div id="coords-pill"></div>
  <div id="route-pill"></div>
  <div id="zoom-btns">
    <div class="zbtn" id="zin">+</div>
    <div class="zbtn" id="zout">−</div>
  </div>
  <div id="attr">© Яндекс Карты</div>
</div>

<script>
// ── Projection ─────────────────────────────────────────────────────────────
// Yandex tiles use EPSG:3395 (elliptical Mercator). See the original comment
// in the first version of this file for why spherical formulas were wrong here.

var TILE = 256;
var ECC  = 0.0818191908426;

function lon2px(lon, z){ return (lon+180)/360*Math.pow(2,z)*TILE; }
function px2lon(px, z){ return px/Math.pow(2,z)/TILE*360-180; }

function lat2py(lat, z){
    var phi = lat*Math.PI/180;
    var es  = ECC*Math.sin(phi);
    var m   = Math.log(Math.tan(Math.PI/4 + phi/2)) - ECC/2*Math.log((1+es)/(1-es));
    return (1 - m/Math.PI)/2*Math.pow(2,z)*TILE;
}

function py2lat(py, z){
    var m = (1 - 2*py/Math.pow(2,z)/TILE)*Math.PI;
    var t = Math.exp(-m);
    var phi = Math.PI/2 - 2*Math.atan(t);
    for(var i=0; i<12; i++){
        var es = ECC*Math.sin(phi);
        var next = Math.PI/2 - 2*Math.atan(t*Math.pow((1-es)/(1+es), ECC/2));
        if(Math.abs(next-phi) < 1e-12){ phi = next; break; }
        phi = next;
    }
    return phi*180/Math.PI;
}

// ── State ──────────────────────────────────────────────────────────────────

var canvas = document.getElementById('c');
var ctx    = canvas.getContext('2d');
var tiles  = {};
var lat = 53.1880, lon = 50.1800;
var zoom = 15;
var marker = null;          // {lat, lon} — picked point in point mode
var markerBearing = 0;      // degrees, shown as arrow on marker

var mapMode = 'point';      // 'point' | 'route'
var routeWaypoints = [];    // [{lat, lon}] in route mode

var MIN_ZOOM = 3, MAX_ZOOM = 19;
var PIN_HEIGHT = 22;

function tileUrl(x, y, z){ return '/tile?z='+z+'&x='+x+'&y='+y; }

function resize(){
    canvas.width  = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    render();
}

// ── Android bridge calls ───────────────────────────────────────────────────

function setMode(m){
    mapMode = m;
    var hint = document.getElementById('hint');
    if(m === 'route'){
        hint.textContent = '📍 Tap to add waypoints • Long-press to remove last';
        hint.style.display = 'block';
        document.getElementById('coords-pill').style.display = 'none';
    } else {
        hint.textContent = '👆 Нажми на карту для выбора точки';
        hint.style.display = 'block';
        document.getElementById('route-pill').style.display = 'none';
    }
    render();
}

function setMarkerBearing(deg){
    markerBearing = deg;
    render();
}

function clearRoute(){
    routeWaypoints = [];
    document.getElementById('route-pill').style.display = 'none';
    render();
}

function goTo(la, lo, z){
    lat = la; lon = lo;
    if(z) zoom = z;
    marker = { lat: la, lon: lo };
    tiles = {};
    render();
    notifyPicked(la, lo);
}

// ── Rendering ──────────────────────────────────────────────────────────────

function render(){
    var w = canvas.width, h = canvas.height;
    if(!w || !h) return;

    ctx.fillStyle = '#e8e0d8';
    ctx.fillRect(0, 0, w, h);

    var cx = lon2px(lon, zoom), cy = lat2py(lat, zoom);
    var originX = cx - w/2, originY = cy - h/2;
    var n = Math.pow(2, zoom);

    var tx0 = Math.floor(originX/TILE), ty0 = Math.floor(originY/TILE);
    var tx1 = Math.ceil((cx + w/2)/TILE), ty1 = Math.ceil((cy + h/2)/TILE);

    for(var tx = tx0; tx <= tx1; tx++){
        for(var ty = ty0; ty <= ty1; ty++){
            if(ty < 0 || ty >= n) continue;
            var wrapped = ((tx % n) + n) % n;
            drawTile(wrapped, ty, Math.round(tx*TILE - originX), Math.round(ty*TILE - originY));
        }
    }

    if(mapMode === 'route'){
        drawRoute(originX, originY);
    } else if(marker){
        drawMarker(originX, originY);
    }
}

function drawTile(x, y, screenX, screenY){
    var key = zoom+'/'+x+'/'+y;
    if(!tiles[key]){
        var img = new Image();
        img.onload = render;
        img.src = tileUrl(x, y, zoom);
        tiles[key] = img;
    }
    var img = tiles[key];
    if(img.complete && img.naturalWidth > 0){
        ctx.drawImage(img, screenX, screenY, TILE, TILE);
    }
}

// ── Point marker with optional bearing arrow ───────────────────────────────

function drawMarker(originX, originY){
    var mx = Math.round(lon2px(marker.lon, zoom) - originX);
    var my = Math.round(lat2py(marker.lat, zoom) - originY);

    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 6; ctx.shadowOffsetY = 3;
    ctx.fillStyle = '#1B8A3C';
    ctx.beginPath(); ctx.arc(mx, my - PIN_HEIGHT, 13, 0, Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(mx, my);
    ctx.lineTo(mx - 9, my - PIN_HEIGHT);
    ctx.lineTo(mx + 9, my - PIN_HEIGHT);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.arc(mx, my - PIN_HEIGHT, 5, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    if(markerBearing > 0){
        var rad = (markerBearing - 90) * Math.PI / 180;
        var len = 26;
        var bx = mx + Math.cos(rad) * len;
        var by = (my - PIN_HEIGHT) + Math.sin(rad) * len;
        ctx.save();
        ctx.strokeStyle = '#FF6B00'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(mx, my - PIN_HEIGHT);
        ctx.lineTo(bx, by);
        ctx.stroke();
        var ang = Math.atan2(by - (my - PIN_HEIGHT), bx - mx);
        ctx.fillStyle = '#FF6B00';
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.lineTo(bx - 8*Math.cos(ang - 0.45), by - 8*Math.sin(ang - 0.45));
        ctx.lineTo(bx - 8*Math.cos(ang + 0.45), by - 8*Math.sin(ang + 0.45));
        ctx.closePath(); ctx.fill();
        ctx.restore();
    }
}

// ── Route drawing ──────────────────────────────────────────────────────────

function toScreen(wp, originX, originY){
    return {
        x: Math.round(lon2px(wp.lon, zoom) - originX),
        y: Math.round(lat2py(wp.lat, zoom) - originY)
    };
}

function drawRoute(originX, originY){
    if(routeWaypoints.length === 0) return;

    var pts = routeWaypoints.map(function(wp){ return toScreen(wp, originX, originY); });

    // Polyline
    if(pts.length >= 2){
        ctx.save();
        ctx.strokeStyle = '#1565C0';
        ctx.lineWidth = 3;
        ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for(var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        ctx.stroke();
        ctx.restore();
    }

    // Numbered waypoint circles
    pts.forEach(function(p, i){
        var isLast = (i === pts.length - 1);
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 5;
        ctx.fillStyle = isLast ? '#E53935' : '#1565C0';
        ctx.beginPath(); ctx.arc(p.x, p.y, 13, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'white';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(i + 1), p.x, p.y);
        ctx.restore();
    });
}

// ── Panning and picking ────────────────────────────────────────────────────

var dragging = false, lastX = 0, lastY = 0, panned = false, startX = 0, startY = 0;
var touchStartTime = 0;
var PAN_THRESHOLD = 6;
var LONG_PRESS_MS = 500;

canvas.addEventListener('touchstart', function(e){
    e.preventDefault();
    if(e.touches.length !== 1) return;
    dragging = true; panned = false;
    lastX = startX = e.touches[0].clientX;
    lastY = startY = e.touches[0].clientY;
    touchStartTime = Date.now();
}, { passive:false });

canvas.addEventListener('touchmove', function(e){
    e.preventDefault();
    if(!dragging || e.touches.length !== 1) return;
    var dx = e.touches[0].clientX - lastX, dy = e.touches[0].clientY - lastY;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    if(Math.abs(startX - lastX) > PAN_THRESHOLD || Math.abs(startY - lastY) > PAN_THRESHOLD) panned = true;
    pan(dx, dy);
}, { passive:false });

canvas.addEventListener('touchend', function(e){
    e.preventDefault();
    dragging = false;
    if(panned) return;
    var elapsed = Date.now() - touchStartTime;
    var r = canvas.getBoundingClientRect();
    if(elapsed >= LONG_PRESS_MS && mapMode === 'route'){
        // Long press: remove last waypoint
        if(routeWaypoints.length > 0){
            routeWaypoints.pop();
            render();
            updateRoutePill();
            if(window.Android) Android.onWaypointRemoved();
        }
        return;
    }
    pick(startX - r.left, startY - r.top);
}, { passive:false });

canvas.addEventListener('click', function(e){ pick(e.offsetX, e.offsetY); });

function pan(dx, dy){
    lon = px2lon(lon2px(lon, zoom) - dx, zoom);
    lat = Math.max(-85, Math.min(85, py2lat(lat2py(lat, zoom) - dy, zoom)));
    render();
}

function pick(x, y){
    var originX = lon2px(lon, zoom) - canvas.width/2;
    var originY = lat2py(lat, zoom) - canvas.height/2;
    var picked = {
        lat: py2lat(originY + y, zoom),
        lon: px2lon(originX + x, zoom)
    };
    if(mapMode === 'route'){
        routeWaypoints.push(picked);
        render();
        updateRoutePill();
        if(window.Android) Android.onWaypointAdded(picked.lat, picked.lon);
    } else {
        marker = picked;
        render();
        notifyPicked(picked.lat, picked.lon);
    }
}

function notifyPicked(la, lo){
    var pill = document.getElementById('coords-pill');
    pill.textContent = '📍 ' + la.toFixed(5) + ',  ' + lo.toFixed(5);
    pill.style.display = 'block';
    document.getElementById('hint').style.display = 'none';
    if(window.Android) Android.onLocationPicked(la, lo);
}

function updateRoutePill(){
    var pill = document.getElementById('route-pill');
    var n = routeWaypoints.length;
    if(n === 0){ pill.style.display = 'none'; return; }
    pill.textContent = '🛣 ' + n + ' ' + (n === 1 ? 'точка' : n < 5 ? 'точки' : 'точек');
    pill.style.display = 'block';
    document.getElementById('hint').style.display = 'none';
}

// ── Zoom ───────────────────────────────────────────────────────────────────

document.getElementById('zin').addEventListener('click', function(){
    if(zoom < MAX_ZOOM){ zoom++; tiles = {}; render(); }
});
document.getElementById('zout').addEventListener('click', function(){
    if(zoom > MIN_ZOOM){ zoom--; tiles = {}; render(); }
});

window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
